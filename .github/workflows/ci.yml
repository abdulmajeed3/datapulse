name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: datapulse
          POSTGRES_DB: datapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://datapulse:datapulse@localhost:5432/datapulse_test
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      UPLOAD_DIR: /tmp/datapulse_test_uploads

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify app imports
        run: uv run python -c "from app.main import app; print('App imports OK')"

      - name: Run unit tests (no DB required)
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run API tests (requires DB)
        run: uv run pytest tests/api/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always()
        with:
          fail_ci_if_error: false
