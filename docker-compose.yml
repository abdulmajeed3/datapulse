version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: datapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse
      POSTGRES_DB: datapulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run the DataPulse API in Docker as well
  # api:
  #   build: .
  #   container_name: datapulse-api
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://datapulse:datapulse@postgres:5432/datapulse
  #     SECRET_KEY: ${SECRET_KEY}
  #   volumes:
  #     - ./data/uploads:/app/data/uploads

volumes:
  postgres_data:
